<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header__container">
        <div class="header__izquierda">
            <a class="header__marca" href="admin.html">
                <img class="header__img" src="img/logo_proyecto.png" alt="Volver al panel">
            </a>
        </div>

        <nav class="header__nav">
            <a class="boton boton--secundario header__boton" href="admin.html">Pedidos</a>
            <a class="boton boton--secundario header__boton" href="index.html">Ver tienda</a>
        </nav>

        <div class="header__acciones">
            <a class="header__icono" href="login.html" aria-label="Mi cuenta">
                <svg class="header__svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
            </a>
        </div>
    </header>

    <main class="contenido panel">
        <div class="catalogo__cabecera">
            <div>
                <p class="catalogo__etiqueta">Administración</p>
                <h1 class="catalogo__titulo">Gestión de usuarios</h1>
            </div>
            <p class="panel__saludo"></p>
        </div>

        <div class="panel__contenido">
            <section class="panel__seccion">
                <div class="panel__cabecera">
                    <h2 class="panel__subtitulo">Usuarios</h2>
                    <div class="panel__botones">
                        <button class="boton boton--secundario panel__actualizar panel__exportar" type="button">Exportar usuarios a JSON</button>
                        <button class="boton boton--secundario panel__actualizar panel__recargar" type="button">Actualizar</button>
                    </div>
                </div>

                <p class="panel__mensaje panel__mensaje--usuarios"></p>

                <div class="panel__tabla-contenedor">
                    <table class="panel__tabla">
                        <thead>
                            <tr>
                                <th class="panel__celda-titulo">Usuario</th>
                                <th class="panel__celda-titulo">Rol</th>
                                <th class="panel__celda-titulo">Estado</th>
                                <th class="panel__celda-titulo">Último acceso</th>
                                <th class="panel__celda-titulo">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="panel__usuarios">
                            <tr>
                                <td class="panel__vacio" colspan="5">Cargando usuarios...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="panel__seccion panel__seccion--lateral">
                <h2 class="panel__subtitulo">Nuevo usuario</h2>
                <p class="panel__ayuda">La contraseña se guarda cifrada con bcrypt.</p>

                <form class="panel__formulario">
                    <div class="custom__campo">
                        <label class="custom__label" for="usuario-nombre">Nombre completo</label>
                        <input class="custom__input" type="text" id="usuario-nombre" name="nombre" maxlength="100" required>
                    </div>

                    <div class="custom__campo">
                        <label class="custom__label" for="usuario-username">Usuario</label>
                        <input class="custom__input" type="text" id="usuario-username" name="username" minlength="3" maxlength="40" pattern="[a-zA-Z0-9._\-]+" required>
                    </div>

                    <div class="custom__campo">
                        <label class="custom__label" for="usuario-password">Contraseña</label>
                        <input class="custom__input" type="password" id="usuario-password" name="password" minlength="8" required>
                    </div>

                    <div class="custom__campo">
                        <label class="custom__label" for="usuario-rol">Rol</label>
                        <select class="custom__input" id="usuario-rol" name="rol" required>
                            <option value="">Cargando roles...</option>
                        </select>
                    </div>

                    <button class="boton boton--naranja panel__guardar">Crear usuario</button>
                    <p class="panel__mensaje panel__mensaje--crear"></p>
                </form>
            </section>
        </div>
    </main>

    <script src="javascript/script.js"></script>
    <script src="javascript/login.js"></script>
    <script src="javascript/usuarios.js"></script>
</body>

</html>
