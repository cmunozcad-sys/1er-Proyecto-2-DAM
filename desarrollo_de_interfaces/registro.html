<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header__container">
        <div class="header__izquierda">
            <a class="header__marca" href="index.html">
                <img class="header__img" src="img/logo_proyecto.png" alt="Volver al inicio">
            </a>
        </div>

        <nav class="header__nav">
            <a class="boton boton--secundario header__boton" href="index.html">Inicio</a>
            <a class="boton boton--secundario header__boton" href="detalle.html">Modelos</a>
        </nav>

        <div class="header__acciones">
            <a class="header__icono" href="#" aria-label="Buscar">
                <svg class="header__svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
            </a>
            <a class="header__icono" href="login.html" aria-label="Mi cuenta">
                <svg class="header__svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
            </a>
            <a class="header__icono" href="#comprar" aria-label="Carrito">
                <svg class="header__svg" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
                <span class="header__contador">0</span>
            </a>
        </div>
    </header>

    <main class="contenido login">
        <section class="login__recuadro">
            <p class="login__etiqueta">Mi cuenta</p>
            <h1 class="login__titulo">Crea tu cuenta</h1>
            <p class="login__descripcion">Las cuentas nuevas tienen el rol Comercial.</p>

            <form class="login__formulario registro__formulario" novalidate>
                <div class="custom__campo">
                    <label class="custom__label" for="registro-nombre">Nombre completo</label>
                    <input class="custom__input" type="text" id="registro-nombre" name="nombre" maxlength="100" autocomplete="name" placeholder="Tu nombre y apellidos">
                </div>

                <div class="custom__campo">
                    <label class="custom__label" for="registro-usuario">Usuario</label>
                    <input class="custom__input" type="text" id="registro-usuario" name="username" maxlength="40" autocomplete="username" placeholder="Letras, números, puntos o guiones">
                </div>

                <div class="custom__campo">
                    <label class="custom__label" for="registro-password">Contraseña</label>
                    <input class="custom__input" type="password" id="registro-password" name="password" autocomplete="new-password" placeholder="Al menos 8 caracteres">
                </div>

                <div class="custom__campo">
                    <label class="custom__label" for="registro-repetir">Repite la contraseña</label>
                    <input class="custom__input" type="password" id="registro-repetir" name="repetir" autocomplete="new-password" placeholder="Escríbela otra vez">
                </div>

                <button class="boton boton--naranja login__boton registro__boton" type="submit">Crear cuenta</button>

                <p class="login__mensaje registro__mensaje"></p>
            </form>

            <p class="login__pie">¿Ya tienes cuenta? <a class="login__enlace" href="login.html">Inicia sesión</a></p>
        </section>
    </main>

    <script src="javascript/script.js"></script>
    <script src="javascript/login.js"></script>
    <script src="javascript/carrito.js"></script>
    <script src="javascript/registro.js"></script>
</body>

</html>
